<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 Central de Intervenção</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f5f5; height: 100vh; overflow: hidden; }
        
        .header { 
            background: #c62828; 
            color: white; 
            padding: 15px 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 20px; }
        .header a { 
            color: white; 
            text-decoration: none; 
            background: rgba(255,255,255,0.2); 
            padding: 8px 15px; 
            border-radius: 5px;
        }
        
        .container { display: flex; height: calc(100vh - 60px); }
        
        .sidebar { 
            width: 380px; 
            background: white; 
            border-right: 1px solid #ddd; 
            display: flex;
            flex-direction: column;
        }
        .sidebar-header { 
            padding: 15px; 
            background: #f5f5f5; 
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-atualizar {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .chamados-list { overflow-y: auto; flex: 1; padding: 10px; }
        .chamado { 
            padding: 15px; 
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            border-left: 4px solid #ccc;
            background: #f9f9f9;
        }
        .chamado:hover { background: #f0f0f0; }
        .chamado.ativo { 
            background: #ffebee; 
            border-left-color: #c62828;
        }
        .chamado.novo { 
            border-left-color: #0f9d58;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { background: #e8f5e9; }
            50% { background: #f9f9f9; }
        }
        .chamado-nome { font-weight: bold; color: #333; }
        .badge { 
            font-size: 11px; 
            padding: 3px 10px; 
            border-radius: 12px;
            margin-left: 10px;
        }
        .badge.pendente { background: #ff9800; color: white; }
        .chamado-msg { font-size: 13px; color: #666; margin-top: 5px; }
        .chamado-info { font-size: 11px; color: #999; margin-top: 8px; }
        
        .chat-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #e5ddd5;
        }
        .chat-header { 
            background: white; 
            padding: 15px 20px; 
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header-info h3 { margin-bottom: 5px; }
        .chat-header-info p { font-size: 13px; color: #666; }
        
        .chat-messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg { 
            max-width: 75%; 
            padding: 12px 15px; 
            border-radius: 12px;
        }
        .msg.cliente { 
            background: white; 
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .msg.robo { 
            background: #dcf8c6; 
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .msg.humano { 
            background: #fff3e0; 
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 2px solid #ff9800;
        }
        .msg-info { font-size: 11px; color: #999; margin-top: 5px; text-align: right; }
        
        .chat-input { 
            background: white; 
            padding: 15px; 
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }
        .chat-input textarea { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 8px;
            resize: none;
            height: 60px;
        }
        .chat-input button { 
            background: #c62828; 
            color: white; 
            border: none; 
            padding: 0 25px; 
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        .chat-input button:disabled { background: #ccc; }
        
        .envio-direto {
            background: white;
            padding: 15px 20px;
            border-top: 3px solid #c62828;
        }
        .envio-direto h4 { color: #c62828; margin-bottom: 10px; }
        .envio-direto-row { display: flex; gap: 10px; }
        .envio-direto input { width: 200px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .envio-direto textarea { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; height: 50px; resize: none; }
        .envio-direto button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        
        .sem-chamado {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
        }
        .sem-chamado-icon { font-size: 60px; margin-bottom: 20px; }
        
        .loading { text-align: center; padding: 30px; color: #666; }
        .erro-msg { background: #ffebee; color: #c62828; padding: 15px; margin: 10px; border-radius: 8px; }
        
        .btn-resolver {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚨 Central de Intervenção</h1>
        <a href="/">← Voltar ao Treinamento</a>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>📋 Chamados Pendentes</span>
                <button class="btn-atualizar" onclick="carregarChamados()">🔄 Atualizar</button>
            </div>
            <div class="chamados-list" id="listaChamados">
                <div class="loading">Carregando...</div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <div class="chat-header-info">
                    <h3>Selecione um chamado</h3>
                    <p>Clique em um cliente ao lado para ver o histórico</p>
                </div>
                <button class="btn-resolver" onclick="marcarResolvido()" id="btnResolver" style="display: none;">
                    ✅ Marcar Resolvido
                </button>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="sem-chamado">
                    <div class="sem-chamado-icon">💬</div>
                    <h3>Nenhum chamado selecionado</h3>
                    <p>Selecione um cliente ao lado para ver a conversa</p>
                </div>
            </div>

            <div class="chat-input">
                <textarea id="msgResposta" placeholder="Digite sua resposta..." disabled></textarea>
                <button onclick="enviarResposta()" id="btnEnviar" disabled>📤 Enviar</button>
            </div>

            <div class="envio-direto">
                <h4>📤 Enviar mensagem para qualquer número:</h4>
                <div class="envio-direto-row">
                    <input type="text" id="numeroDireto" placeholder="5511999999999">
                    <textarea id="msgDireta" placeholder="Mensagem..."></textarea>
                    <button onclick="enviarDireto()">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // SUA CHAVE DO SUPABASE (JÁ CONFIGURADA)
        const SUPABASE_URL = 'https://ehpikmqrieldplwkmyyo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocGlrbXFyaWVsZHBsd2tteXlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxMzkzMjIsImV4cCI6MjA4OTcxNTMyMn0.7q5-vcJfzqjcaiiuvDg1kMGFmWEH07bBscqKH85DN0c';
        
        let clienteAtual = null;
        let refreshInterval;

        window.onload = () => {
            carregarChamados();
            refreshInterval = setInterval(carregarChamados, 5000);
            
            const urlParams = new URLSearchParams(window.location.search);
            const tel = urlParams.get('telefone');
            if (tel) setTimeout(() => abrirChat(tel), 800);
        };

        async function carregarChamados() {
            const div = document.getElementById('listaChamados');
            
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/intervencoes?status=eq.pendente&order=data.desc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                const chamados = await res.json();
                
                if (chamados.length === 0) {
                    div.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: #999;">
                            <div style="font-size: 50px; margin-bottom: 15px;">✅</div>
                            <p>Nenhum chamado pendente!</p>
                            <small>O robô está resolvendo tudo sozinho</small>
                        </div>
                    `;
                    return;
                }

                div.innerHTML = chamados.map(c => `
                    <div class="chamado ${clienteAtual?.telefone === c.telefone ? 'ativo' : ''} ${c.status === 'pendente' ? 'novo' : ''}" 
                         onclick="abrirChat('${c.telefone}')">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span class="chamado-nome">${c.nome}</span>
                            <span class="badge ${c.status}">${c.status}</span>
                        </div>
                        <div class="chamado-msg">${c.mensagem || 'Sem mensagem'}</div>
                        <div class="chamado-info">
                            📱 ${c.telefone} • 🕐 ${new Date(c.data).toLocaleTimeString()}
                        </div>
                    </div>
                `).join('');
                
            } catch (erro) {
                div.innerHTML = `<div class="erro-msg">❌ Erro: ${erro.message}</div>`;
            }
        }

        async function abrirChat(telefone) {
            clienteAtual = { telefone };
            
            try {
                const resCliente = await fetch(`${SUPABASE_URL}/rest/v1/clientes?telefone=eq.${telefone}&select=*`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const cliente = await resCliente.json();
                
                if (cliente[0]) {
                    clienteAtual = { ...clienteAtual, ...cliente[0] };
                }
                
                document.getElementById('chatHeader').innerHTML = `
                    <div class="chat-header-info">
                        <h3>${clienteAtual.nome || 'Cliente'}</h3>
                        <p>📱 ${telefone} | 🔧 ${clienteAtual.servico || '-'} | 📍 ${clienteAtual.bairro || '-'} | 📊 ${clienteAtual.etapa || 'inicio'}</p>
                    </div>
                    <button class="btn-resolver" onclick="marcarResolvido()" id="btnResolver">
                        ✅ Marcar Resolvido
                    </button>
                `;
                
                document.getElementById('msgResposta').disabled = false;
                document.getElementById('btnEnviar').disabled = false;
                
            } catch (e) {
                console.error('Erro buscar cliente:', e);
            }
            
            await carregarHistorico(telefone);
            carregarChamados();
        }

        async function carregarHistorico(telefone) {
            const div = document.getElementById('chatMessages');
            div.innerHTML = '<div class="loading">Carregando histórico...</div>';
            
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/historico?telefone=eq.${telefone}&order=data.asc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                const mensagens = await res.json();
                
                if (mensagens.length === 0) {
                    div.innerHTML = '<div style="text-align: center; padding: 20px; color: #999;">Sem histórico de mensagens</div>';
                    return;
                }

                div.innerHTML = mensagens.map(m => `
                    <div class="msg ${m.origem}">
                        ${m.mensagem}
                        <div class="msg-info">
                            ${m.origem === 'cliente' ? '👤 Cliente' : m.origem === 'robo' ? '🤖 Robô' : '👩‍💼 Você'} 
                            • ${new Date(m.data).toLocaleTimeString()}
                        </div>
                    </div>
                `).join('');
                
                div.scrollTop = div.scrollHeight;
                
            } catch (erro) {
                div.innerHTML = `<div class="erro-msg">❌ Erro ao carregar histórico: ${erro.message}</div>`;
            }
        }

        async function enviarResposta() {
            if (!clienteAtual) {
                alert('Selecione um chamado primeiro!');
                return;
            }
            
            const btn = document.getElementById('btnEnviar');
            const textarea = document.getElementById('msgResposta');
            const texto = textarea.value.trim();
            
            if (!texto) return;
            
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            
            try {
                const res = await fetch('/api/resposta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telefone: clienteAtual.telefone,
                        mensagem: texto
                    })
                });
                
                const dados = await res.json();
                
                if (!dados.sucesso) throw new Error(dados.erro || 'Erro ao enviar');
                
                textarea.value = '';
                await carregarHistorico(clienteAtual.telefone);
                await carregarChamados();
                
            } catch (erro) {
                alert('❌ Erro ao enviar: ' + erro.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '📤 Enviar';
            }
        }

        async function enviarDireto() {
            const numero = document.getElementById('numeroDireto').value.trim();
            const msg = document.getElementById('msgDireta').value.trim();
            
            if (!numero || !msg) {
                alert('Preencha número e mensagem!');
                return;
            }
            
            try {
                const res = await fetch('/api/resposta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: numero, mensagem: msg })
                });
                
                const dados = await res.json();
                
                if (dados.sucesso) {
                    alert('✅ Mensagem enviada!');
                    document.getElementById('numeroDireto').value = '';
                    document.getElementById('msgDireta').value = '';
                } else {
                    throw new Error(dados.erro);
                }
                
            } catch (erro) {
                alert('❌ Erro: ' + erro.message);
            }
        }

        async function marcarResolvido() {
            if (!clienteAtual) return;
            
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/intervencoes?telefone=eq.${clienteAtual.telefone}&status=eq.pendente`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'resolvido' })
                });
                
                carregarChamados();
                
                document.getElementById('chatMessages').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #4caf50;">
                        <div style="font-size: 60px; margin-bottom: 20px;">✅</div>
                        <h3>Chamado resolvido!</h3>
                    </div>
                `;
                document.getElementById('chatHeader').innerHTML = `
                    <div class="chat-header-info">
                        <h3>Selecione um chamado</h3>
                        <p>Chamado anterior resolvido com sucesso</p>
                    </div>
                `;
                document.getElementById('msgResposta').disabled = true;
                document.getElementById('btnEnviar').disabled = true;
                document.getElementById('btnResolver').style.display = 'none';
                clienteAtual = null;
                
            } catch (erro) {
                alert('❌ Erro: ' + erro.message);
            }
        }

        // Atalho Ctrl+Enter
        document.getElementById('msgResposta')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) enviarResposta();
        });
    </script>
</body>
</html>
