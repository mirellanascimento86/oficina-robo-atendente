<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 Central de Intervenção - Oficina IA</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f5f5f5; height:100vh; overflow:hidden; }
        .header { background:#00b894; color:white; padding:15px; display:flex; justify-content:space-between; align-items:center; font-size:18px; }
        .container { display:flex; height:calc(100vh - 60px); }
        .sidebar { width:380px; background:white; border-right:1px solid #ddd; overflow-y:auto; }
        .chat-area { flex:1; display:flex; flex-direction:column; background:#e5ddd5; }
        .chat-messages { flex:1; overflow-y:auto; padding:20px; background:#e5ddd5; }
        .msg { max-width:80%; padding:12px 16px; border-radius:18px; margin-bottom:10px; font-size:15px; }
        .msg.cliente { background:white; align-self:flex-start; border-bottom-left-radius:4px; }
        .msg.robo { background:#dcf8c6; align-self:flex-end; border-bottom-right-radius:4px; }
        .msg.humano { background:#fff3e0; align-self:flex-end; border:2px solid #ff9800; border-bottom-right-radius:4px; }
        /* Mobile fix */
        @media (max-width: 768px) {
            .container { flex-direction:column; }
            .sidebar { width:100%; height:35%; border-right:none; border-bottom:1px solid #ddd; }
            .chat-area { height:65%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚨 Intervenção - Oficina IA</h1>
        <span>👥 Equipe pode usar pelo celular</span>
    </div>
    <div class="container">
        <div class="sidebar"> <!-- lista de chamados (mesmo código anterior) --> </div>
        <div class="chat-area">
            <!-- header do chat + mensagens + input (mesmo código anterior, mas com CSS corrigido) -->
        </div>
    </div>
    <script>
        // mesmo script anterior + SUPABASE_KEY via prompt ou localStorage
    </script>
</body>
</html>
