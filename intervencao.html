<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 Central de Intervenção - Oficina IA</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f5f5f5; height:100vh; overflow:hidden; }
        .header { background:#00b894; color:white; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; }
        .container { display:flex; height:calc(100vh - 60px); }
        .sidebar { width:380px; background:white; border-right:1px solid #ddd; overflow-y:auto; padding:10px; }
        .chat-area { flex:1; display:flex; flex-direction:column; background:#e5ddd5; }
        .chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
        .msg { max-width:75%; padding:12px 16px; border-radius:12px; font-size:14px; }
        .msg.cliente { background:white; align-self:flex-start; border-bottom-left-radius:4px; }
        .msg.robo { background:#dcf8c6; align-self:flex-end; border-bottom-right-radius:4px; }
        .msg.humano { background:#fff3e0; align-self:flex-end; border:2px solid #ff9800; border-bottom-right-radius:4px; }
        .chat-input { background:white; padding:15px; border-top:1px solid #ddd; display:flex; gap:10px; }
        .chat-input textarea { flex:1; padding:12px; border:1px solid #ddd; border-radius:8px; resize:none; height:60px; }
        @media (max-width: 768px) {
            .container { flex-direction:column; }
            .sidebar { width:100%; height:40%; border-right:none; border-bottom:1px solid #ddd; }
            .chat-area { height:60%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚨 Intervenção - Oficina IA</h1>
        <span>👥 Use no celular ou PC</span>
    </div>
    <div class="container">
        <div class="sidebar" id="listaChamados"></div>
        <div class="chat-area">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <textarea id="msgResposta" placeholder="Digite sua intervenção..."></textarea>
                <button onclick="enviarResposta()" style="background:#00b894;color:white;border:none;padding:0 25px;border-radius:8px;">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ehpikmqrieldplwkmyyo.supabase.co';
        let SUPABASE_KEY = localStorage.getItem('supabase_key') || prompt('🔑 Cole sua SERVICE ROLE KEY:');
        localStorage.setItem('supabase_key', SUPABASE_KEY);

        let clienteAtual = null;

        window.onload = () => {
            carregarChamados();
            setInterval(carregarChamados, 3000);
        };

        async function carregarChamados() {
            const div = document.getElementById('listaChamados');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/intervencoes?status=eq.pendente&order=data.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                let data = await res.json();
                if (!Array.isArray(data)) data = [];
                div.innerHTML = data.length ? data.map(c => `
                    <div onclick="abrirChat('${c.telefone}')" style="padding:15px;margin:8px;border-radius:8px;background:#f9f9f9;cursor:pointer;">
                        <strong>${c.nome || 'Cliente'}</strong><br>
                        📱 ${c.telefone}<br>
                        💬 ${c.mensagem || 'Precisa intervenção'}
                    </div>`).join('') : '<div style="padding:40px;text-align:center;color:#666;">Nenhum chamado pendente</div>';
            } catch(e) { div.innerHTML = '<div style="color:red;padding:20px;">Erro ao carregar</div>'; }
        }

        async function abrirChat(telefone) {
            clienteAtual = { telefone };
            await carregarHistorico(telefone);
        }

        async function carregarHistorico(telefone) {
            const div = document.getElementById('chatMessages');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/historico?telefone=eq.${telefone}&order=data.asc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const msgs = await res.json();
                div.innerHTML = msgs.map(m => `<div class="msg ${m.origem}">${m.mensagem}</div>`).join('');
                div.scrollTop = div.scrollHeight;
            } catch(e) {}
        }

        async function enviarResposta() {
            const texto = document.getElementById('msgResposta').value.trim();
            if (!texto || !clienteAtual) return;
            await fetch('/api/resposta-humano', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ telefone: clienteAtual.telefone, mensagem: texto })
            });
            document.getElementById('msgResposta').value = '';
            carregarHistorico(clienteAtual.telefone);
        }
    </script>
</body>
</html>
