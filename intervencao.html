<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 Central de Intervenção - Oficina</title>
    <style>
        <div style="background:#00b894;color:white;padding:10px;text-align:center;font-size:14px;">
  👥 Compartilhe este link com a equipe: https://oficina-robo-atendente.vercel.app/intervencao.html
</div>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f5f5; height: 100vh; overflow: hidden; }
        .header { background: #c62828; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 380px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: #f5f5f5; border-bottom: 1px solid #ddd; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .btn-atualizar { background: #1a73e8; color: white; border: none; padding: 5px 12px; border-radius: 3px; cursor: pointer; }
        .chamados-list { overflow-y: auto; flex: 1; padding: 10px; }
        .chamado { padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; background: #f9f9f9; border-left: 4px solid #ccc; }
        .chamado:hover { background: #f0f0f0; }
        .chamado.ativo { background: #ffebee; border-left-color: #c62828; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 14px; }
        .msg.cliente { background: white; align-self: flex-start; }
        .msg.robo { background: #dcf8c6; align-self: flex-end; }
        .msg.humano { background: #fff3e0; align-self: flex-end; border: 2px solid #ff9800; }
        .chat-input { background: white; padding: 15px; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        .chat-input textarea { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: none; height: 60px; }
        .envio-direto { background: white; padding: 15px 20px; border-top: 3px solid #c62828; }
        .erro-msg { background: #ffebee; color: #c62828; padding: 15px; margin: 10px; border-radius: 8px; border-left: 4px solid #c62828; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚨 Central de Intervenção</h1>
        <a href="/">← Voltar</a>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>📋 Chamados Pendentes</span>
                <button class="btn-atualizar" onclick="carregarChamados()">🔄 Atualizar</button>
            </div>
            <div class="chamados-list" id="listaChamados"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <div class="chat-header-info">
                    <h3>Selecione um chamado</h3>
                    <p>Clique em um cliente ao lado</p>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <textarea id="msgResposta" placeholder="Digite sua intervenção aqui..." disabled></textarea>
                <button onclick="enviarResposta()" id="btnEnviar" disabled>📤 Enviar como Humano</button>
            </div>
            <div class="envio-direto">
                <h4>📤 Enviar direto para qualquer número</h4>
                <input id="numeroDireto" placeholder="5511999999999" style="width:200px;padding:10px;">
                <textarea id="msgDireta" placeholder="Mensagem..." style="flex:1;height:50px;margin:0 10px;"></textarea>
                <button onclick="enviarDireto()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ehpikmqrieldplwkmyyo.supabase.co';
        let SUPABASE_KEY = localStorage.getItem('supabase_key') || prompt('🔑 Cole sua SERVICE ROLE KEY do Supabase (uma vez só):');
        localStorage.setItem('supabase_key', SUPABASE_KEY);

        let clienteAtual = null;

        window.onload = () => {
            carregarChamados();
            setInterval(carregarChamados, 3000); // tempo real a cada 3 segundos
        };

        async function carregarChamados() {
            const div = document.getElementById('listaChamados');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/intervencoes?status=eq.pendente&order=data.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                let chamados = await res.json();
                if (!Array.isArray(chamados)) chamados = [];

                if (chamados.length === 0) {
                    div.innerHTML = `<div style="padding:40px;text-align:center;color:#666;">✅ Nenhum chamado pendente<br><small>O robô está resolvendo sozinho</small></div>`;
                    return;
                }

                div.innerHTML = chamados.map(c => `
                    <div class="chamado" onclick="abrirChat('${c.telefone}')">
                        <strong>${c.nome || 'Cliente'}</strong><br>
                        📱 ${c.telefone}<br>
                        💬 ${c.mensagem || 'Precisa de intervenção'}
                    </div>
                `).join('');
            } catch (e) {
                div.innerHTML = `<div class="erro-msg">❌ Erro ao carregar chamados.<br>Verifique se a SERVICE ROLE KEY está correta.</div>`;
            }
        }

        async function abrirChat(telefone) {
            clienteAtual = { telefone };
            document.getElementById('msgResposta').disabled = false;
            document.getElementById('btnEnviar').disabled = false;
            await carregarHistorico(telefone);
        }

        async function carregarHistorico(telefone) {
            const div = document.getElementById('chatMessages');
            div.innerHTML = 'Carregando histórico...';
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/historico?telefone=eq.${telefone}&order=data.asc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const msgs = await res.json();
                div.innerHTML = msgs.map(m => `
                    <div class="msg ${m.origem}">
                        ${m.mensagem}
                        <small>${new Date(m.data).toLocaleTimeString()}</small>
                    </div>
                `).join('');
                div.scrollTop = div.scrollHeight;
            } catch (e) {}
        }

        async function enviarResposta() {
            const texto = document.getElementById('msgResposta').value.trim();
            if (!texto || !clienteAtual) return;
            await fetch('/api/resposta-humano', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ telefone: clienteAtual.telefone, mensagem: texto })
            });
            document.getElementById('msgResposta').value = '';
            await carregarHistorico(clienteAtual.telefone);
        }

        async function enviarDireto() {
            const numero = document.getElementById('numeroDireto').value.trim();
            const msg = document.getElementById('msgDireta').value.trim();
            if (!numero || !msg) return alert('Preencha número e mensagem');
            await fetch('/api/resposta-humano', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ telefone: numero, mensagem: msg })
            });
            alert('✅ Enviado!');
            document.getElementById('msgDireta').value = '';
        }
    </script>
</body>
</html>
