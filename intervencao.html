<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚨 Intervenção - Oficina IA</title>
    <style>
        :root { --primary: #00b894; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f5f5f5; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
        
        .header {
            background:#00b894; color:white; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; font-size:18px; position:sticky; top:0; z-index:10;
        }
        .container { display:flex; flex:1; overflow:hidden; }
        
        /* LISTA DE CONVERSAS (WhatsApp style) */
        .chat-list {
            width:380px; background:white; border-right:1px solid #ddd; overflow-y:auto; 
        }
        .chat-item {
            padding:15px 20px; border-bottom:1px solid #eee; cursor:pointer; display:flex; align-items:center; gap:12px;
        }
        .chat-item:hover { background:#f0f0f0; }
        .chat-item.ativo { background:#e5f5e5; }
        .chat-item .avatar { width:50px; height:50px; background:#ddd; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
        .chat-item .info { flex:1; }
        .chat-item .nome { font-weight:bold; }
        .chat-item .ultima { font-size:13px; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .badge-intervencao { background:#c62828; color:white; font-size:11px; padding:2px 8px; border-radius:12px; }

        /* CHAT PRINCIPAL */
        .chat-area { flex:1; display:flex; flex-direction:column; background:#e5ddd5; }
        .chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
        .msg { max-width:75%; padding:12px 16px; border-radius:18px; font-size:15.5px; line-height:1.4; }
        .msg.cliente { background:white; align-self:flex-start; border-bottom-left-radius:4px; }
        .msg.robo { background:#dcf8c6; align-self:flex-end; border-bottom-right-radius:4px; }
        .msg.humano { background:#fff3e0; align-self:flex-end; border:2px solid #ff9800; border-bottom-right-radius:4px; }
        
        /* BARRA DE ENVIO FIXA (WhatsApp style) */
        .chat-input {
            background:white; padding:8px 12px; border-top:1px solid #ddd; 
            display:flex; align-items:center; gap:8px; position:sticky; bottom:0; z-index:10;
        }
        .chat-input textarea {
            flex:1; padding:12px 16px; border:1px solid #ddd; border-radius:30px; resize:none; height:48px; max-height:120px;
        }
        .chat-input button {
            background:var(--primary); color:white; border:none; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px;
        }

        /* MOBILE FIX (Android + iOS) */
        @media (max-width: 768px) {
            .container { flex-direction:column; }
            .chat-list { width:100%; height:45%; border-right:none; border-bottom:1px solid #ddd; }
            .chat-area { height:55%; }
            .chat-input { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
        }
        
        .sem-chamado { text-align:center; padding:60px 20px; color:#888; }
    </style>
</head>
<body>

<div class="header">
    <h1>🚨 Intervenção - Oficina IA</h1>
    <span>👥 Use no celular ou PC</span>
</div>

<div class="container">
    <!-- LISTA DE CONVERSAS -->
    <div class="chat-list" id="listaConversas"></div>

    <!-- CHAT ABERTO -->
    <div class="chat-area">
        <div id="chatHeader" style="background:white;padding:15px;border-bottom:1px solid #ddd;font-weight:bold;display:none;"></div>
        <div class="chat-messages" id="chatMessages"></div>
        
        <div class="chat-input">
            <textarea id="msgResposta" placeholder="Digite sua mensagem como humano..."></textarea>
            <button onclick="enviarResposta()">➤</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://ehpikmqrieldplwkmyyo.supabase.co';
    let SUPABASE_KEY = localStorage.getItem('supabase_key') || prompt('🔑 Cole sua SERVICE ROLE KEY (uma vez só):');
    localStorage.setItem('supabase_key', SUPABASE_KEY);

    let clienteAtual = null;

    window.onload = () => {
        carregarConversas();
        setInterval(carregarConversas, 2500); // atualiza a cada 2,5s
    };

    async function carregarConversas() {
        const div = document.getElementById('listaConversas');
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/intervencoes?status=eq.pendente&order=data.desc`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            let chats = await res.json();
            if (!Array.isArray(chats)) chats = [];

            div.innerHTML = chats.length ? chats.map(c => `
                <div class="chat-item ${clienteAtual?.telefone === c.telefone ? 'ativo' : ''}" onclick="abrirChat('${c.telefone}', '${c.nome || 'Cliente'}')">
                    <div class="avatar">👤</div>
                    <div class="info">
                        <div class="nome">${c.nome || 'Cliente Desconhecido'}</div>
                        <div class="ultima">📱 ${c.telefone}</div>
                    </div>
                    <span class="badge-intervencao">INTERVENÇÃO</span>
                </div>
            `).join('') : '<div class="sem-chamado">Nenhuma conversa precisando de intervenção no momento</div>';
        } catch(e) {
            div.innerHTML = '<div style="padding:20px;color:red;">Erro ao carregar conversas</div>';
        }
    }

    async function abrirChat(telefone, nome) {
        clienteAtual = { telefone, nome };
        document.getElementById('chatHeader').innerHTML = `
            <strong>${nome}</strong> • ${telefone}
            <button onclick="marcarResolvido()" style="margin-left:auto;background:#4caf50;color:white;border:none;padding:6px 12px;border-radius:20px;">✅ Resolvido</button>
        `;
        document.getElementById('chatHeader').style.display = 'flex';
        await carregarHistorico(telefone);
    }

    async function carregarHistorico(telefone) {
        const div = document.getElementById('chatMessages');
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/historico?telefone=eq.${telefone}&order=data.asc`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const msgs = await res.json();
            div.innerHTML = msgs.map(m => `
                <div class="msg ${m.origem}">
                    ${m.mensagem}
                    <small style="display:block;margin-top:4px;opacity:0.7;">${new Date(m.data).toLocaleTimeString('pt-BR')}</small>
                </div>
            `).join('');
            div.scrollTop = div.scrollHeight;
        } catch(e) {}
    }

    async function enviarResposta() {
        const texto = document.getElementById('msgResposta').value.trim();
        if (!texto || !clienteAtual) return alert('Selecione uma conversa primeiro');
        
        await fetch('/api/resposta-humano', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ telefone: clienteAtual.telefone, mensagem: texto, origem: 'humano' })
        });
        
        document.getElementById('msgResposta').value = '';
        await carregarHistorico(clienteAtual.telefone);
        carregarConversas();
    }

    async function marcarResolvido() {
        if (!clienteAtual) return;
        await fetch(`${SUPABASE_URL}/rest/v1/intervencoes?telefone=eq.${clienteAtual.telefone}`, {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'resolvido' })
        });
        alert('✅ Chamado marcado como resolvido!');
        carregarConversas();
        document.getElementById('chatMessages').innerHTML = '';
        document.getElementById('chatHeader').style.display = 'none';
        clienteAtual = null;
    }
</script>
</body>
</html>
