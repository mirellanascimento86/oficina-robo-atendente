
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>🚨 Central de Intervenção</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f5f5; height: 100vh; overflow: hidden; }
        
        .header { 
            background: #c62828; 
            color: white; 
            padding: 15px 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 20px; }
        .header a { color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 5px; }
        
        .container { display: flex; height: calc(100vh - 60px); }
        
        /* Sidebar */
        .sidebar { 
            width: 350px; 
            background: white; 
            border-right: 1px solid #ddd; 
            display: flex;
            flex-direction: column;
        }
        .sidebar-header { 
            padding: 15px; 
            background: #f5f5f5; 
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }
        .chamados-list { overflow-y: auto; flex: 1; }
        .chamado { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer;
            transition: 0.2s;
        }
        .chamado:hover { background: #f5f5f5; }
        .chamado.ativo { background: #ffebee; border-left: 4px solid #c62828; }
        .chamado.novo { border-left: 4px solid #0f9d58; }
        .chamado-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .chamado-nome { font-weight: bold; color: #333; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; }
        .badge.pendente { background: #ff9800; color: white; }
        .badge.resolvido { background: #4caf50; color: white; }
        .chamado-msg { font-size: 13px; color: #666; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chamado-info { font-size: 11px; color: #999; margin-top: 5px; }
        
        /* Chat */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
        .chat-header { 
            background: white; 
            padding: 15px 20px; 
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header-info h3 { margin-bottom: 5px; }
        .chat-header-info p { font-size: 13px; color: #666; }
        
        .chat-messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg { 
            max-width: 70%; 
            padding: 12px 15px; 
            border-radius: 15px;
            position: relative;
            word-wrap: break-word;
        }
        .msg.cliente { 
            background: white; 
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        .msg.robo { 
            background: #dcf8c6; 
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        .msg.humano { 
            background: #fff3e0; 
            align-self: flex-end;
            border-bottom-right-radius: 5px;
            border: 2px solid #ff9800;
        }
        .msg-info { 
            font-size: 11px; 
            color: #666; 
            margin-top: 5px;
            text-align: right;
        }
        
        .chat-input { 
            background: white; 
            padding: 15px; 
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }
        .chat-input textarea { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 5px;
            resize: none;
            height: 60px;
            font-family: inherit;
        }
        .chat-input button { 
            background: #c62828; 
            color: white; 
            border: none; 
            padding: 0 25px; 
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .chat-input button:hover { background: #b71c1c; }
        .chat-input button:disabled { background: #ccc; cursor: not-allowed; }
        
        /* Envio direto */
        .envio-direto {
            background: white;
            padding: 15px;
            border-top: 2px solid #c62828;
        }
        .envio-direto h4 { margin-bottom: 10px; color: #c62828; font-size: 14px; }
        .envio-direto-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .envio-direto input, .envio-direto textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .envio-direto input { width: 200px; }
        .envio-direto textarea { flex: 1; height: 50px; resize: none; }
        .envio-direto button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .sem-chamado {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
        }
        
        .loading { text-align: center; padding: 20px; color: #999; }
        .erro { background: #ffebee; color: #c62828; padding: 15px; margin: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚨 Central de Intervenção</h1>
        <a href="/">← Voltar ao Treinamento</a>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                📋 Chamados Pendentes
                <button onclick="carregarChamados()" style="float: right; font-size: 12px;">🔄 Atualizar</button>
            </div>
            <div class="chamados-list" id="listaChamados">
                <div class="loading">Carregando...</div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <div class="chat-header-info">
                    <h3>Selecione um chamado</h3>
                    <p>Clique em um cliente ao lado para ver o histórico</p>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="sem-chamado">
                    Nenhum chamado selecionado
                </div>
            </div>

            <div class="chat-input">
                <textarea id="msgResposta" placeholder="Digite sua resposta..." disabled></textarea>
                <button onclick="enviarResposta()" id="btnEnviar" disabled>📤 Enviar</button>
            </div>

            <div class="envio-direto">
                <h4>📤 Enviar mensagem para qualquer número:</h4>
                <div class="envio-direto-row">
                    <input type="text" id="numeroDireto" placeholder="5511999999999">
                    <textarea id="msgDireta" placeholder="Mensagem..."></textarea>
                    <button onclick="enviarDireto()">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO
        const SUPABASE_URL = 'https://ehpikmqrieldplwkmyyo.supabase.co';
        const SUPABASE_KEY = 'sua-chave-anon-aqui'; // ⬅️ COLE SUA CHAVE AQUI!
        
        let clienteAtual = null;
        let refreshInterval;

        // Verifica configuração
        if (SUPABASE_KEY === 'sua-chave-anon-aqui') {
            document.getElementById('listaChamados').innerHTML = 
                '<div class="erro">⚠️ Configure a chave do Supabase na linha 189!</div>';
        } else {
            carregarChamados();
            refreshInterval = setInterval(carregarChamados, 5000);
            
            // Verifica URL param
            const urlParams = new URLSearchParams(window.location.search);
            const tel = urlParams.get('telefone');
            if (tel) setTimeout(() => abrirChat(tel), 500);
        }

        async function carregarChamados() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/intervencoes?status=eq.pendente&order=data.desc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                if (!res.ok) throw new Error('Erro ao carregar');
                
                const chamados = await res.json();
                const div = document.getElementById('listaChamados');
                
                if (chamados.length === 0) {
                    div.innerHTML = '<div style="padding: 20px; color: #999; text-align: center;">Nenhum chamado pendente ✅</div>';
                    return;
                }

                div.innerHTML = chamados.map(c => `
                    <div class="chamado ${clienteAtual?.telefone === c.telefone ? 'ativo' : ''} ${c.status === 'pendente' ? 'novo' : ''}" 
                         onclick="abrirChat('${c.telefone}')">
                        <div class="chamado-header">
                            <span class="chamado-nome">${c.nome}</span>
                            <span class="badge ${c.status}">${c.status}</span>
                        </div>
                        <div class="chamado-msg">${c.mensagem || 'Sem mensagem'}</div>
                        <div class="chamado-info">
                            📱 ${c.telefone} • ${new Date(c.data).toLocaleTimeString()}
                        </div>
                    </div>
                `).join('');
                
            } catch (erro) {
                document.getElementById('listaChamados').innerHTML = 
                    `<div class="erro">Erro: ${erro.message}</div>`;
            }
        }

        async function abrirChat(telefone) {
            clienteAtual = { telefone };
            
            // Busca dados do cliente
            try {
                const resCliente = await fetch(`${SUPABASE_URL}/rest/v1/clientes?telefone=eq.${telefone}&select=*`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const cliente = await resCliente.json();
                if (cliente[0]) {
                    clienteAtual = { ...clienteAtual, ...cliente[0] };
                }
                
                // Atualiza header
                document.getElementById('chatHeader').innerHTML = `
                    <div class="chat-header-info">
                        <h3>${clienteAtual.nome || 'Cliente'}</h3>
                        <p>📱 ${telefone} | 🔧 ${clienteAtual.servico || '-'} | 📍 ${clienteAtual.bairro || '-'} | Etapa: ${clienteAtual.etapa || 'inicio'}</p>
                    </div>
                    <button onclick="marcarResolvido()" style="background: #4caf50; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
                        ✅ Marcar Resolvido
                    </button>
                `;
                
                // Habilita input
                document.getElementById('msgResposta').disabled = false;
                document.getElementById('btnEnviar').disabled = false;
                
            } catch (e) {
                console.error('Erro ao buscar cliente:', e);
            }
            
            // Busca HISTÓRICO COMPLETO
            await carregarHistorico(telefone);
            
            // Atualiza lista visual
            carregarChamados();
        }

        async function carregarHistorico(telefone) {
            const div = document.getElementById('chatMessages');
            div.innerHTML = '<div class="loading">Carregando histórico...</div>';
            
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/historico?telefone=eq.${telefone}&order=data.asc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                const mensagens = await res.json();
                
                if (mensagens.length === 0) {
                    div.innerHTML = '<div class="sem-chamado">Sem histórico de mensagens</div>';
                    return;
                }

                div.innerHTML = mensagens.map(m => `
                    <div class="msg ${m.origem}">
                        ${m.mensagem}
                        <div class="msg-info">
                            ${m.origem === 'cliente' ? '👤 Cliente' : m.origem === 'robo' ? '🤖 Robô' : '👩‍💼 Você'} 
                            • ${new Date(m.data).toLocaleTimeString()}
                        </div>
                    </div>
                `).join('');
                
                // Scroll para baixo
                div.scrollTop = div.scrollHeight;
                
            } catch (erro) {
                div.innerHTML = `<div class="erro">Erro ao carregar histórico: ${erro.message}</div>`;
            }
        }

        async function enviarResposta() {
            if (!clienteAtual) return;
            
            const btn = document.getElementById('btnEnviar');
            const textarea = document.getElementById('msgResposta');
            const texto = textarea.value.trim();
            
            if (!texto) return;
            
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            
            try {
                // Envia para API
                const res = await fetch('/api/resposta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telefone: clienteAtual.telefone,
                        mensagem: texto
                    })
                });
                
                const dados = await res.json();
                
                if (!dados.sucesso) throw new Error(dados.erro || 'Erro ao enviar');
                
                // Limpa e recarrega
                textarea.value = '';
                await carregarHistorico(clienteAtual.telefone);
                await carregarChamados();
                
            } catch (erro) {
                alert('Erro ao enviar: ' + erro.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '📤 Enviar';
            }
        }

        async function enviarDireto() {
            const numero = document.getElementById('numeroDireto').value.trim();
            const msg = document.getElementById('msgDireta').value.trim();
            
            if (!numero || !msg) {
                alert('Preencha número e mensagem!');
                return;
            }
            
            try {
                const res = await fetch('/api/resposta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: numero, mensagem: msg })
                });
                
                const dados = await res.json();
                
                if (dados.sucesso) {
                    alert('✅ Mensagem enviada!');
                    document.getElementById('numeroDireto').value = '';
                    document.getElementById('msgDireta').value = '';
                } else {
                    throw new Error(dados.erro);
                }
                
            } catch (erro) {
                alert('❌ Erro: ' + erro.message);
            }
        }

        async function marcarResolvido() {
            if (!clienteAtual) return;
            
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/intervencoes?telefone=eq.${clienteAtual.telefone}&status=eq.pendente`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'resolvido' })
                });
                
                carregarChamados();
                
                // Limpa chat
                document.getElementById('chatMessages').innerHTML = '<div class="sem-chamado">Chamado resolvido ✅</div>';
                document.getElementById('chatHeader').innerHTML = `
                    <div class="chat-header-info">
                        <h3>Selecione um chamado</h3>
                        <p>Chamado anterior resolvido</p>
                    </div>
                `;
                document.getElementById('msgResposta').disabled = true;
                document.getElementById('btnEnviar').disabled = true;
                clienteAtual = null;
                
            } catch (erro) {
                alert('Erro ao marcar resolvido: ' + erro.message);
            }
        }

        // Atalho: Ctrl+Enter para enviar
        document.getElementById('msgResposta')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) enviarResposta();
        });
    </script>
</body>
</html>
