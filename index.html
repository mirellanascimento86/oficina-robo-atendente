<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botpress • Treinamento do Robô - Oficina</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00b894; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f4f6f9; display:flex; min-height:100vh; }
        .sidebar { width:260px; background:#2d3436; color:white; padding:20px; }
        .main { flex:1; padding:30px; overflow:auto; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
        .card { background:white; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); padding:25px; margin-bottom:25px; }
        .tab { display:none; }
        .tab.active { display:block; }
        .btn { background:var(--primary); color:white; border:none; padding:12px 24px; border-radius:8px; cursor:pointer; font-weight:600; }
        input, textarea, select { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; margin-top:8px; }
        .item { background:#f8f9fa; padding:15px; border-radius:8px; margin:10px 0; display:flex; justify-content:space-between; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color:#00b894;margin-bottom:30px;"><i class="fas fa-robot"></i> Oficina Bot</h2>
        <div onclick="mostrar('personalidade')" class="menu-item" style="padding:15px;cursor:pointer;">Personalidade & Tom</div>
        <div onclick="mostrar('scripts')" class="menu-item" style="padding:15px;cursor:pointer;">Scripts de Atendimento</div>
        <div onclick="mostrar('regras')" class="menu-item" style="padding:15px;cursor:pointer;">Regras & Procedimentos</div>
        <div onclick="mostrar('precos')" class="menu-item" style="padding:15px;cursor:pointer;">Preços por Bairro</div>
        <div onclick="mostrar('tecnicos')" class="menu-item" style="padding:15px;cursor:pointer;">Cadastre Técnicos</div>
        <div onclick="mostrar('teste')" class="menu-item" style="padding:15px;cursor:pointer;">Testar Robô</div>
        <a href="/intervencao.html" style="position:absolute;bottom:30px;left:30px;color:#00b894;text-decoration:none;font-weight:bold;">🚨 Ir para Intervenção</a>
    </div>

    <div class="main">
        <!-- As seções vão aqui (Personalidade, Scripts, etc.) — mantenha o conteúdo que você já tinha, só troquei o visual -->
        <!-- ... (o resto do seu conteúdo antigo pode ser colado aqui dentro das divs com class="card tab") ... -->
    </div>

    <script>
        // Seu JavaScript antigo continua funcionando (salvar no Supabase etc.)
        function mostrar(secao) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(secao).classList.add('active');
        }
        // ... resto do seu JS de salvar técnicos, preços, etc.
    </script>
</body>
</html>
