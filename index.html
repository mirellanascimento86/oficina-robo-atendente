<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina IA - Treinamento</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00b894; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f4f6f9; display:flex; min-height:100vh; }
        .sidebar { width:280px; background:#2d3436; color:white; padding:25px 20px; }
        .menu-item { padding:15px 20px; cursor:pointer; border-radius:8px; margin-bottom:8px; }
        .menu-item:hover, .menu-item.active { background:#00b894; color:white; }
        .main { flex:1; padding:40px; overflow:auto; }
        .card { background:white; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.1); padding:30px; margin-bottom:30px; }
        .tab { display:none; }
        .tab.active { display:block; }
        input, textarea { width:100%; padding:14px; border:1px solid #ddd; border-radius:10px; margin-top:8px; }
        .btn { background:var(--primary); color:white; border:none; padding:14px 28px; border-radius:10px; cursor:pointer; font-weight:600; }
        .item { background:#f8f9fa; padding:15px; border-radius:10px; margin:12px 0; display:flex; justify-content:space-between; }
    </style>
</head>
<body>
<div class="sidebar">
    
 
    <h2><i class="fas fa-robot"></i> Oficina IA</h2>
    <div class="menu-item active" onclick="mostrar('personalidade')">👤 Personalidade</div>
    <div class="menu-item" onclick="mostrar('scripts')">📝 Scripts</div>
    <div class="menu-item" onclick="mostrar('regras')">⚖️ Regras</div>
    <div class="menu-item" onclick="mostrar('precos')">💰 Preços de Serviços</div>
    <div class="menu-item" onclick="mostrar('tecnicos')">🔧 Técnicos</div>
    <div class="menu-item" onclick="mostrar('teste')">🧪 Testar Robô</div>
    <a href="/intervencao.html" style="position:absolute;bottom:40px;left:25px;color:#00b894;">🚨 Intervenção</a>
</div>

<div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
        <h1>Treinamento do Robô</h1>
        <button class="btn" onclick="salvarTudo()">💾 Salvar Tudo</button>
    </div>

    <div id="personalidade" class="tab active card"> <h2>Personalidade</h2> <textarea id="txtPersonalidade" rows="8"></textarea> </div>
    <div id="scripts" class="tab card"> <h2>Scripts</h2> <textarea id="txtScripts" rows="12"></textarea> </div>
    <div id="regras" class="tab card"> <h2>Regras</h2> <textarea id="txtRegras" rows="10"></textarea> </div>
    <div id="precos" class="tab card"> <h2>Preços de Serviços</h2> <button class="btn" onclick="adicionarPreco()">+ Novo</button> <div id="listaPrecos"></div> </div>
    <div id="tecnicos" class="tab card"> <h2>Técnicos</h2> <button class="btn" onclick="adicionarTecnico()">+ Novo</button> <div id="listaTecnicos"></div> </div>
    <div id="teste" class="tab card"> <h2>Testar Robô</h2> <div id="chatTeste" style="height:420px;overflow:auto;background:#e5ddd5;padding:20px;border-radius:12px;"></div> <input id="msgTeste" placeholder="Digite como cliente" style="width:100%;margin-top:10px;padding:14px;"> <button class="btn" onclick="enviarTeste()" style="margin-top:10px;">Enviar</button> </div>
</div>

<script>
    const ADMIN_SENHA = "info261";
    const SUPABASE_URL = 'https://ehpikmqrieldplwkmyyo.supabase.co';
    let SUPABASE_KEY = localStorage.getItem('supabase_key') || '';

    window.onload = () => {
        if (!localStorage.getItem('admin_logged')) {
            const senha = prompt("🔐 Senha de Administradora:");
            if (senha !== ADMIN_SENHA) {
                alert("Acesso negado.");
                window.location.href = "/intervencao.html";
                return;
            }
            localStorage.setItem('admin_logged', 'true');
        }
        if (!SUPABASE_KEY) SUPABASE_KEY = prompt("🔑 SERVICE ROLE KEY:");
        localStorage.setItem('supabase_key', SUPABASE_KEY);
        carregarDados();
    };

  function mostrar(id, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));

    document.getElementById(id).classList.add('active');
    if (el) el.classList.add('active');
}

    async function salvarTudo() {
    const personalidade = document.getElementById("txtPersonalidade").value;
    const scripts = document.getElementById("txtScripts").value;
    const regras = document.getElementById("txtRegras").value;

    await fetch(`${SUPABASE_URL}/rest/v1/config?id=eq.1`, {
        method: "PATCH",
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            personalidade,
            scripts,
            regras
        })
    });

    alert("✅ Salvo de verdade!");
}

async function carregarDados() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/config?id=eq.1`, {
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
        }
    });

    const data = await res.json();

    if (data && data.length > 0) {
        document.getElementById("txtPersonalidade").value = data[0].personalidade || "";
        document.getElementById("txtScripts").value = data[0].scripts || "";
        document.getElementById("txtRegras").value = data[0].regras || "";
    }
}

    // Adicionar preços e técnicos (mesmo código anterior)
    function adicionarPreco() { /* mesmo */ }
    function adicionarTecnico() { /* mesmo */ }

    async function enviarTeste() { /* chama Groq */ }
    const ADMIN_SENHA = "info261";
const SUPABASE_URL = 'https://ehpikmqrieldplwkmyyo.supabase.co';
let SUPABASE_KEY = localStorage.getItem('supabase_key') || '';

window.onload = async () => {
    // 🔐 LOGIN REAL
    if (!localStorage.getItem('admin')) {
        const senha = prompt("🔐 Senha de Administradora:");
        if (senha !== ADMIN_SENHA) {
            document.body.innerHTML = "<h1 style='padding:40px'>Acesso negado</h1>";
            return;
        }
        localStorage.setItem('admin', 'true');
    }

    if (!SUPABASE_KEY) {
        SUPABASE_KEY = prompt("🔑 Cole sua SERVICE ROLE KEY:");
        localStorage.setItem('supabase_key', SUPABASE_KEY);
    }

    await carregarTreinamento();
};

async function salvarTudo() {
    const texto = `
PERSONALIDADE:
${document.getElementById("txtPersonalidade").value}

SCRIPTS:
${document.getElementById("txtScripts").value}

REGRAS:
${document.getElementById("txtRegras").value}
`;

    await fetch(`${SUPABASE_URL}/rest/v1/treinamento?id=eq.1`, {
        method: "PATCH",
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ conteudo: texto })
    });

    alert("✅ AGENTE TREINADO COM SUCESSO!");
}

async function carregarTreinamento() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/treinamento?id=eq.1`, {
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
        }
    });

    const data = await res.json();

    if (!data || !data[0]) return;

    const texto = data[0].conteudo || "";

    document.getElementById("txtPersonalidade").value = extrair(texto, "PERSONALIDADE:");
    document.getElementById("txtScripts").value = extrair(texto, "SCRIPTS:");
    document.getElementById("txtRegras").value = extrair(texto, "REGRAS:");
}

function extrair(texto, chave) {
    const partes = texto.split(chave);
    if (partes.length < 2) return "";
    return partes[1].split("\n\n")[0].trim();
}
</script>
    
</body>
</html>
