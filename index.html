<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botpress • Oficina IA - Treinamento (Apenas Administradora)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00b894; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f4f6f9; display:flex; min-height:100vh; }
        .sidebar { width:280px; background:#2d3436; color:white; padding:25px 20px; }
        .main { flex:1; padding:30px; overflow:auto; }
        .card { background:white; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.1); padding:30px; margin-bottom:25px; }
        .menu-item { padding:15px 20px; cursor:pointer; border-radius:8px; margin-bottom:8px; }
        .menu-item:hover, .menu-item.active { background:#00b894; color:white; }
        input, textarea { width:100%; padding:14px; border:1px solid #ddd; border-radius:10px; margin-top:8px; }
        .btn { background:#00b894; color:white; border:none; padding:14px 28px; border-radius:10px; cursor:pointer; font-weight:600; }
        .item { background:#f8f9fa; padding:15px; border-radius:10px; margin:12px 0; display:flex; justify-content:space-between; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2><i class="fas fa-robot"></i> Oficina IA</h2>
        <div class="menu-item active" onclick="mostrar('personalidade')">👤 Personalidade</div>
        <div class="menu-item" onclick="mostrar('scripts')">📝 Scripts</div>
        <div class="menu-item" onclick="mostrar('regras')">⚖️ Regras</div>
        <div class="menu-item" onclick="mostrar('precos')">💰 Preços</div>
        <div class="menu-item" onclick="mostrar('tecnicos')">🔧 Técnicos</div>
        <div class="menu-item" onclick="mostrar('teste')">🧪 Testar</div>
        <a href="/intervencao.html" style="position:absolute;bottom:40px;left:25px;color:#00b894;font-size:18px;text-decoration:none;">🚨 Intervenção</a>
    </div>

    <div class="main">
        <div class="header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
            <h1>Treinamento do Robô (Apenas Mirella)</h1>
            <button class="btn" onclick="salvarTudo()">💾 Salvar Tudo</button>
        </div>

        <div id="personalidade" class="card tab active"> <!-- conteúdo completo das abas conforme o anterior que te dei --> </div>
        <!-- Repita as outras divs de scripts, regras, precos, tecnicos, teste conforme o index.html que te entreguei na mensagem anterior -->
        <!-- (para não ficar gigante aqui, use o que eu te dei na última resposta – é idêntico) -->
    </div>

    <script>
        // Senha de administradora (mude se quiser)
        const ADMIN_PASSWORD = "mirella123";
        let SUPABASE_KEY = localStorage.getItem('supabase_key') || '';

        window.onload = () => {
            if (!localStorage.getItem('admin_logged')) {
                const senha = prompt("🔐 Digite a senha de administradora:");
                if (senha !== ADMIN_PASSWORD) {
                    alert("Acesso negado. Apenas a administradora pode treinar o robô.");
                    window.location.href = "/intervencao.html";
                    return;
                }
                localStorage.setItem('admin_logged', 'true');
            }
            // resto do código de carregar/salvar (igual ao que te dei antes)
        };
    </script>
</body>
</html>
