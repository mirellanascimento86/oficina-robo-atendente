<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina IA - Treinamento</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00b894; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f4f6f9; display:flex; min-height:100vh; flex-direction:column; }
        .sidebar { width:100%; background:#2d3436; color:white; padding:15px; display:flex; flex-wrap:wrap; gap:8px; }
        .menu-item { padding:12px 18px; background:#3d4a4f; color:white; border-radius:8px; cursor:pointer; font-size:15px; flex:1; min-width:140px; text-align:center; }
        .menu-item.active { background:#00b894; }
        .main { flex:1; padding:20px; overflow:auto; }
        .card { background:white; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.1); padding:25px; margin-bottom:25px; }
        .tab { display:none; }
        .tab.active { display:block; }
        textarea { width:100%; padding:14px; border:1px solid #ddd; border-radius:10px; margin-top:8px; font-size:16px; }
        .btn { background:#00b894; color:white; border:none; padding:14px; border-radius:10px; cursor:pointer; font-weight:600; width:100%; margin-top:15px; }
        @media (min-width: 768px) {
            body { flex-direction:row; }
            .sidebar { width:280px; flex-direction:column; padding:25px 20px; }
            .menu-item { flex:none; text-align:left; }
            .main { padding:40px; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="menu-item active" onclick="mostrar('personalidade')">👤 Personalidade</div>
    <div class="menu-item" onclick="mostrar('scripts')">📝 Scripts</div>
    <div class="menu-item" onclick="mostrar('regras')">⚖️ Regras</div>
    <div class="menu-item" onclick="mostrar('precos')">💰 Preços</div>
    <div class="menu-item" onclick="mostrar('tecnicos')">🔧 Técnicos</div>
    <div class="menu-item" onclick="mostrar('teste')">🧪 Testar</div>
    <a href="/intervencao.html" style="margin-top:20px;color:#00b894;font-size:18px;text-decoration:none;width:100%;text-align:center;">🚨 Intervenção</a>
</div>

<div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
        <h1>Treinamento do Robô</h1>
        <button class="btn" onclick="salvarTudo()">💾 Salvar Tudo</button>
    </div>

    <div id="personalidade" class="tab active card">
        <h2>👤 Personalidade</h2>
        <textarea id="txtPersonalidade" rows="6"></textarea>
    </div>
    <div id="scripts" class="tab card">
        <h2>📝 Scripts</h2>
        <textarea id="txtScripts" rows="10"></textarea>
    </div>
    <div id="regras" class="tab card">
        <h2>⚖️ Regras</h2>
        <textarea id="txtRegras" rows="8"></textarea>
    </div>
    <div id="precos" class="tab card">
        <h2>💰 Preços de Serviços</h2>
        <button class="btn" onclick="adicionarPreco()">+ Novo</button>
        <div id="listaPrecos"></div>
    </div>
    <div id="tecnicos" class="tab card">
        <h2>🔧 Técnicos</h2>
        <button class="btn" onclick="adicionarTecnico()">+ Novo</button>
        <div id="listaTecnicos"></div>
    </div>
    <div id="teste" class="tab card">
        <h2>🧪 Testar Robô</h2>
        <div id="chatTeste" style="height:380px;overflow:auto;background:#e5ddd5;padding:15px;border-radius:12px;"></div>
        <input id="msgTeste" placeholder="Digite como cliente" style="margin-top:15px;width:100%;padding:14px;">
        <button class="btn" onclick="enviarTeste()" style="margin-top:10px;">Enviar</button>
    </div>
</div>

<script>
    const ADMIN_SENHA = "info261";
    const SUPABASE_URL = 'https://ehpikmqrieldplwkmyyo.supabase.co';
    let SUPABASE_KEY = '';

    window.onload = async () => {
        if (!localStorage.getItem('admin_logged')) {
            const senha = prompt("🔐 Senha de Administradora:");
            if (senha !== ADMIN_SENHA) {
                alert("Senha incorreta.");
                window.location.href = "/intervencao.html";
                return;
            }
            localStorage.setItem('admin_logged', 'true');
        }

        // Força pedir a SERVICE ROLE KEY
        SUPABASE_KEY = prompt("🔑 COLE A SERVICE ROLE KEY AQUI (a chave que termina com TeIQ):\n\nNão use a anon key!");
        if (!SUPABASE_KEY || SUPABASE_KEY.length < 100) {
            alert("Chave inválida. Tente novamente.");
            location.reload();
            return;
        }
        localStorage.setItem('supabase_key', SUPABASE_KEY);

        await carregarDados();
    };

    function mostrar(id) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelector(`.menu-item[onclick="mostrar('${id}')"]`).classList.add('active');
    }

   async function salvarTudo() {
  const body = {
    personalidade: document.getElementById('txtPersonalidade').value,
    scripts: document.getElementById('txtScripts').value,
    regras: document.getElementById('txtRegras').value
  };

  const res = await fetch("/api/salvar-config", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });

  if (res.ok) {
    alert("✅ SALVO COM SUCESSO!");
  } else {
    const errorText = await res.text();
    alert("❌ Erro ao salvar:\n" + errorText);
  }
}

    async function carregarDados() {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/config`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const data = await res.json();
            if (data && data[0]) {
                document.getElementById('txtPersonalidade').value = data[0].personalidade || '';
                document.getElementById('txtScripts').value = data[0].scripts || '';
                document.getElementById('txtRegras').value = data[0].regras || '';
            }
        } catch(e) {
            console.log("Erro ao carregar");
        }
    }

    function adicionarPreco() { alert("Adicione preços manualmente na tabela config por enquanto"); }
    function adicionarTecnico() { alert("Adicione técnicos manualmente na tabela Supabase"); }

    async function enviarTeste() {
        const input = document.getElementById("msgTeste");
        const chat = document.getElementById("chatTeste");
        const texto = input.value.trim();
        if (!texto) return;
        chat.innerHTML += `<div style="text-align:right;margin:10px;"><b>Você:</b> ${texto}</div>`;
        input.value = "";
        try {
            const res = await fetch("/api/test-chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ mensagem: texto })
            });
            const data = await res.json();
            chat.innerHTML += `<div style="text-align:left;margin:10px;"><b>Agente IA:</b> ${data.resposta}</div>`;
        } catch(e) {
            chat.innerHTML += `<div style="text-align:left;margin:10px;color:red;">Erro ao conectar com Groq</div>`;
        }
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
