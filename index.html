<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botpress • Oficina IA - Treinamento</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00b894; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f4f6f9; display:flex; min-height:100vh; }
        .sidebar { width:280px; background:#2d3436; color:white; padding:25px 20px; }
        .menu-item { padding:15px 20px; cursor:pointer; border-radius:8px; margin-bottom:8px; }
        .menu-item:hover, .menu-item.active { background:#00b894; color:white; }
        .main { flex:1; padding:40px; overflow:auto; }
        .card { background:white; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.1); padding:30px; margin-bottom:30px; }
        .tab { display:none; }
        .tab.active { display:block; }
        input, textarea { width:100%; padding:14px; border:1px solid #ddd; border-radius:10px; margin-top:8px; }
        .btn { background:var(--primary); color:white; border:none; padding:14px 28px; border-radius:10px; cursor:pointer; font-weight:600; }
    </style>
</head>
<body>
<div class="sidebar">
    <h2><i class="fas fa-robot"></i> Oficina IA</h2>
    <div class="menu-item active" onclick="mostrar('personalidade')">👤 Personalidade</div>
    <div class="menu-item" onclick="mostrar('scripts')">📝 Scripts</div>
    <div class="menu-item" onclick="mostrar('regras')">⚖️ Regras</div>
    <div class="menu-item" onclick="mostrar('precos')">💰 Preços</div>
    <div class="menu-item" onclick="mostrar('tecnicos')">🔧 Técnicos</div>
    <div class="menu-item" onclick="mostrar('teste')">🧪 Testar</div>
    <a href="/intervencao.html" style="position:absolute;bottom:40px;left:25px;color:#00b894;">🚨 Intervenção</a>
</div>

<div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
        <h1>Treinamento do Robô</h1>
        <button class="btn" onclick="salvarTudo()">💾 Salvar Tudo</button>
    </div>

    <div id="personalidade" class="tab active card">
        <h2>👤 Personalidade & Tom</h2>
        <textarea id="txtPersonalidade" rows="8"></textarea>
    </div>
    <div id="scripts" class="tab card">
        <h2>📝 Scripts de Atendimento</h2>
        <textarea id="txtScripts" rows="12"></textarea>
    </div>
    <div id="regras" class="tab card">
        <h2>⚖️ Regras & Procedimentos</h2>
        <textarea id="txtRegras" rows="10"></textarea>
    </div>
    <!-- Adicione as outras abas (precos, tecnicos, teste) se quiser, igual às versões anteriores -->
</div>

<script>
    // Senha simples - só você sabe
    const ADMIN_SENHA = "info261";

    window.onload = () => {
        const senha = prompt("🔐 Digite a senha para acessar o treinamento:");
        if (senha !== ADMIN_SENHA) {
            alert("Senha incorreta. Redirecionando para intervenção.");
            window.location.href = "/intervencao.html";
            return;
        }
        // Carregar dados salvos (mesmo código anterior)
        carregarDados();
    };

    function mostrar(id) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelector(`.menu-item[onclick="mostrar('${id}')"]`).classList.add('active');
    }

    async function salvarTudo() {
        alert('✅ Configurações salvas! O robô vai obedecer essas instruções no WhatsApp.');
        // Aqui você pode adicionar o fetch para salvar no Supabase (personalidade, scripts, regras)
    }

    function carregarDados() {
        // Carregar do Supabase se quiser (opcional por enquanto)
        console.log("Treinamento carregado");
    }
</script>
</body>
</html>
