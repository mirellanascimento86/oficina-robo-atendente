<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botpress • Oficina IA - Treinamento (Apenas Administradora)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00b894; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f4f6f9; display:flex; min-height:100vh; }
        .sidebar { width:280px; background:#2d3436; color:white; padding:25px 20px; }
        .main { flex:1; padding:30px; overflow:auto; }
        .card { background:white; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.1); padding:30px; margin-bottom:25px; }
        .menu-item { padding:15px 20px; cursor:pointer; border-radius:8px; margin-bottom:8px; }
        .menu-item:hover, .menu-item.active { background:#00b894; color:white; }
        input, textarea { width:100%; padding:14px; border:1px solid #ddd; border-radius:10px; margin-top:8px; font-size:16px; }
        .btn { background:#00b894; color:white; border:none; padding:14px 28px; border-radius:10px; cursor:pointer; font-weight:600; }
        .item { background:#f8f9fa; padding:15px; border-radius:10px; margin:12px 0; display:flex; justify-content:space-between; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2><i class="fas fa-robot"></i> Oficina IA</h2>
        <div class="menu-item active" onclick="mostrar('personalidade')">👤 Personalidade</div>

        <div class="menu-item" onclick="mostrar('regras')">⚖️ Regras</div>
        <div class="menu-item" onclick="mostrar('precos')">💰 Preços</div>
        <div class="menu-item" onclick="mostrar('tecnicos')">🔧 Técnicos</div>
        <div class="menu-item" onclick="mostrar('teste')">🧪 Testar Robô</div>
        <a href="/intervencao.html" style="position:absolute;bottom:40px;left:25px;color:#00b894;font-size:18px;text-decoration:none;">🚨 Intervenção</a>
        <a href="/planilha.html" style="position:absolute;bottom:80px;left:25px;color:#00b894;font-size:18px;text-decoration:none;">📊 Planilha em Tempo Real</a>

        </div>

        <div id="personalidade" class="card tab active">
            <h2>👤 Personalidade & Tom</h2>
            <textarea id="txtPersonalidade" rows="6" placeholder="Descreva como o robô deve falar..."></textarea>
        </div>

        <div id="scripts" class="card tab">

    </div>

            if (!localStorage.getItem('admin_logged')) {

                if (senha !== ADMIN_PASSWORD) {
                    alert("❌ Acesso negado. Apenas a administradora pode treinar o robô.");

                    return;
                }

</body>
</html>
