<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento agente IA</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00b894; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f4f6f9; display:flex; min-height:100vh; }
        .sidebar { width:280px; background:#2d3436; color:white; padding:25px 20px; }
        .menu-item { padding:15px 20px; cursor:pointer; border-radius:8px; margin-bottom:8px; }
        .menu-item:hover, .menu-item.active { background:#00b894; color:white; }
        .main { flex:1; padding:40px; overflow:auto; }
        .card { background:white; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.1); padding:30px; margin-bottom:30px; }
        .tab { display:none; }
        .tab.active { display:block; }
        input, textarea { width:100%; padding:14px; border:1px solid #ddd; border-radius:10px; margin-top:8px; }
        .btn { background:var(--primary); color:white; border:none; padding:14px 28px; border-radius:10px; cursor:pointer; font-weight:600; }
.item {
  background:#f8f9fa;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
  display:flex;
  gap:10px;
  align-items:center;
}
    </style>
</head>
<body>
<div class="sidebar">
    
 
    <h2><i class="fas fa-robot"></i> Oficina IA</h2>
    <div class="menu-item active" onclick="mostrar('personalidade')">Personalidade</div>
    <div class="menu-item" onclick="mostrar('scripts', this)">📝 Scripts</div>
    <div class="menu-item" onclick="mostrar('regras', this)">⚖️ Regras</div>
    <div class="menu-item" onclick="mostrar('precos', this)">💰 Preços de Serviços</div>
    <div class="menu-item" onclick="mostrar('tecnicos', this)">🔧 Técnicos</div>
    <div class="menu-item" onclick="mostrar('teste', this)">🧪 Testar IA</div>
    <a href="/intervencao.html" style="position:absolute;bottom:40px;left:25px;color:#00b894;">🚨 Intervenção</a>
</div>

<div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
        <h1>Treinamento do Robô</h1>
        <button class="btn" onclick="salvarTudo()">💾 Salvar Tudo</button>
    </div>

    <div id="personalidade" class="tab active card"> <h2>Personalidade</h2> <textarea id="txtPersonalidade" rows="8"></textarea> </div>
    <div id="scripts" class="tab card"> <h2>Scripts</h2> <textarea id="txtScripts" rows="12"></textarea> </div>
    <div id="regras" class="tab card"> <h2>Regras</h2> <textarea id="txtRegras" rows="10"></textarea> </div>
    <div id="precos" class="tab card"> <h2>Preços de Serviços</h2> <button class="btn" onclick="adicionarPreco()">+ Novo</button> <div id="listaPrecos"></div> </div>
    <div id="tecnicos" class="tab card"> <h2>Técnicos</h2> <button class="btn" onclick="adicionarTecnico()">+ Novo</button> <div id="listaTecnicos"></div> </div>
    <div id="teste" class="tab card"> <h2>Testar Robô</h2> <div id="chatTeste" style="height:420px;overflow:auto;background:#e5ddd5;padding:20px;border-radius:12px;"></div> <input id="msgTeste" placeholder="Digite como cliente" style="width:100%;margin-top:10px;padding:14px;"> <button class="btn" onclick="enviarTeste()" style="margin-top:10px;">Enviar</button> </div>
</div>

<script>
    
const ADMIN_SENHA = "info261";
const SUPABASE_URL = 'https://ehpikmqrieldplwkmyyo.supabase.co';
let SUPABASE_KEY = localStorage.getItem('supabase_key') || '';

window.onload = async () => {
    // LOGIN
    if (!localStorage.getItem('admin')) {
        const senha = prompt("🔐 Senha:");
        if (senha !== ADMIN_SENHA) {
            document.body.innerHTML = "<h2 style='padding:40px'>Acesso negado</h2>";
            return;
        }
        localStorage.setItem('admin', 'true');
    }

    if (!SUPABASE_KEY) {
        SUPABASE_KEY = prompt("🔑 Cole sua SUPABASE KEY:");
        localStorage.setItem('supabase_key', SUPABASE_KEY);
    }

    carregarDados();
};

// MENU FUNCIONANDO
function mostrar(id, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));

    document.getElementById(id).classList.add('active');
    if (el) el.classList.add('active');
}

// SALVAR FUNCIONANDO
async function salvarTudo() {
    const personalidade = document.getElementById("txtPersonalidade").value;
    const scripts = document.getElementById("txtScripts").value;
    const regras = document.getElementById("txtRegras").value;

    // PEGA PREÇOS
    let precos = [];
    document.querySelectorAll("#listaPrecos .item").forEach(el => {
        const inputs = el.querySelectorAll("input");
        precos.push(`${inputs[0].value} - ${inputs[1].value}`);
    });

    // PEGA TÉCNICOS
    let tecnicos = [];
    document.querySelectorAll("#listaTecnicos .item").forEach(el => {
        const inputs = el.querySelectorAll("input");
        tecnicos.push(`${inputs[0].value} - ${inputs[1].value}`);
    });

    const conteudo = `
PERSONALIDADE:
${personalidade}

SCRIPTS:
${scripts}

REGRAS:
${regras}

PREÇOS:
${precos.join("\n")}

TÉCNICOS:
${tecnicos.join("\n")}
`;

    await fetch(`${SUPABASE_URL}/rest/v1/treinamento`, {
        method: "POST",
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "resolution=merge-duplicates"
        },
        body: JSON.stringify({
            id: 1,
            conteudo
        })
    });

    alert("✅ TREINAMENTO COMPLETO SALVO!");
}
// CARREGAR FUNCIONANDO
async function carregarDados() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/treinamento?id=eq.1`, {
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
        }
    });

    const data = await res.json();

    if (!data || !data[0]) return;

    const texto = data[0].conteudo || "";

    document.getElementById("txtPersonalidade").value = extrair(texto, "PERSONALIDADE:");
    document.getElementById("txtScripts").value = extrair(texto, "SCRIPTS:");
    document.getElementById("txtRegras").value = extrair(texto, "REGRAS:");
}

// FUNÇÃO AUXILIAR
function extrair(texto, chave) {
    const partes = texto.split(chave);
    if (partes.length < 2) return "";
    return partes[1].split("\n\n")[0].trim();

}
   function adicionarPreco() {
    const div = document.getElementById("listaPrecos");

    const item = document.createElement("div");
    item.className = "item";

    item.innerHTML = `
        <input type="text" placeholder="Serviço" style="width:40%">
        <input type="text" placeholder="Preço" style="width:40%">
        <button onclick="this.parentElement.remove()">❌</button>
    `;

    div.appendChild(item);
}

function adicionarTecnico() {
    const div = document.getElementById("listaTecnicos");

    const item = document.createElement("div");
    item.className = "item";

    item.innerHTML = `
        <input type="text" placeholder="Nome" style="width:40%">
        <input type="text" placeholder="Especialidade" style="width:40%">
        <button onclick="this.parentElement.remove()">❌</button>
    `;

    div.appendChild(item);
}
async function enviarTeste() {
    const input = document.getElementById("msgTeste");
    const chat = document.getElementById("chatTeste");

    const texto = input.value.trim();
    if (!texto) return;

    chat.innerHTML += `<div style="text-align:right;margin:10px;"><b>Você:</b> ${texto}</div>`;

    input.value = "";

    const res = await fetch("/api/test-chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ mensagem: texto })
    });

    const data = await res.json();

    chat.innerHTML += `<div style="text-align:left;margin:10px;"><b>IA:</b> ${data.resposta}</div>`;
    chat.scrollTop = chat.scrollHeight;
}
</script>
    
</body>
</html>
