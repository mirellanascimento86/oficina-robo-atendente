<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Oficina IA</title>
    <style>
        body { font-family:'Segoe UI',sans-serif; background:linear-gradient(135deg,#00b894,#00695c); height:100vh; margin:0; display:flex; align-items:center; justify-content:center; }
        .card { background:white; padding:40px 30px; border-radius:20px; box-shadow:0 15px 40px rgba(0,0,0,0.25); width:380px; text-align:center; }
        h1 { color:#00b894; margin-bottom:10px; }
        input { width:100%; padding:14px; margin:12px 0; border:1px solid #ddd; border-radius:10px; font-size:16px; }
        button { width:100%; padding:15px; background:#00b894; color:white; border:none; border-radius:10px; font-size:18px; cursor:pointer; margin-top:10px; }
        .error { color:#c62828; margin-top:15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Oficina IA</h1>
        <p>Entre com sua conta</p>
        <input type="text" id="loginInput" placeholder="Login (ex: mirella)">
        <input type="password" id="senhaInput" placeholder="Senha">
        <button onclick="fazerLogin()">Entrar</button>
        <div id="erro" class="error"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ehpikmqrieldplwkmyyo.supabase.co';
        let SUPABASE_KEY = localStorage.getItem('supabase_key') || prompt('🔑 Cole sua SUPABASE SERVICE ROLE KEY (uma vez só):');
        localStorage.setItem('supabase_key', SUPABASE_KEY);

        async function fazerLogin() {
            const login = document.getElementById('loginInput').value.trim();
            const senha = document.getElementById('senhaInput').value.trim();
            const erro = document.getElementById('erro');

            if (!login || !senha) return erro.textContent = 'Preencha login e senha';

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?login=eq.${login}&senha=eq.${senha}`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const users = await res.json();

                if (users.length === 0) {
                    erro.textContent = 'Login ou senha incorretos';
                    return;
                }

                const user = users[0];
                localStorage.setItem('usuario_logado', JSON.stringify(user));

                if (user.role === 'admin') {
                    window.location.href = '/index.html';
                } else {
                    window.location.href = '/intervencao.html';
                }
            } catch(e) {
                erro.textContent = 'Erro de conexão. Verifique a chave Supabase.';
            }
        }
    </script>
</body>
</html>
