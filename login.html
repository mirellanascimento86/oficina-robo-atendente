<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Oficina IA</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #00b894, #00695c); height: 100vh; display: flex; align-items: center; justify-content: center; margin:0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 380px; text-align: center; }
        input { width: 100%; padding: 14px; margin: 12px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #00b894; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Oficina IA</h1>
        <p>Faça login para continuar</p>
        <input type="text" id="login" placeholder="Login (ex: mirella)">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="fazerLogin()">Entrar</button>
        <div id="erro" class="error"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ehpikmqrieldplwkmyyo.supabase.co';
        let SUPABASE_KEY = localStorage.getItem('supabase_key') || prompt('🔑 Cole sua SERVICE ROLE KEY (uma vez só):');
        localStorage.setItem('supabase_key', SUPABASE_KEY);

        async function fazerLogin() {
            const login = document.getElementById('login').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const erroDiv = document.getElementById('erro');

            if (!login || !senha) {
                erroDiv.textContent = 'Preencha login e senha';
                return;
            }

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?login=eq.${login}&senha=eq.${senha}`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const usuarios = await res.json();

                if (usuarios.length === 0) {
                    erroDiv.textContent = 'Login ou senha incorretos';
                    return;
                }

                const user = usuarios[0];
                localStorage.setItem('usuario_logado', JSON.stringify(user));

                if (user.role === 'admin') {
                    window.location.href = '/index.html'; // treinamento
                } else {
                    window.location.href = '/intervencao.html'; // só intervenção
                }
            } catch(e) {
                erroDiv.textContent = 'Erro ao conectar. Verifique a chave Supabase.';
            }
        }
    </script>
</body>
</html>
